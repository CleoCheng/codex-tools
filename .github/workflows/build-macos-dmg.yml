name: Build macOS DMGs

on:
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable with Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend verification
        run: |
          npm run lint
          npm test
          npm run test:pages

      - name: Build Apple Silicon DMG (aarch64)
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg --no-sign

      - name: Build Intel DMG (x86_64)
        run: |
          npx tauri build --target x86_64-apple-darwin --bundles dmg --no-sign

      - name: List generated DMG bundles
        run: ls -lh src-tauri/target/*/release/bundle/dmg/*.dmg

      - name: Upload macOS DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-tools-macos-dmg
          path: src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
