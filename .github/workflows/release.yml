name: Validate and Release Desktop

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v3.2.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:pages
      - run: npm run build
      - name: Rust regression tests
        run: cargo test --locked --lib
        working-directory: src-tauri
      - name: Standalone proxyd check
        run: cargo check --locked --manifest-path gen/remote-build/proxyd/Cargo.toml --target-dir proxyd/target
        working-directory: src-tauri

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "macos-latest"
            args: "--target aarch64-apple-darwin --no-sign"
            bundle_nickname: "macOS Apple Silicon"
          - runner: "macos-15-intel"
            args: "--target x86_64-apple-darwin --no-sign"
            bundle_nickname: "macOS Intel"
          - runner: "windows-latest"
            args: "--bundles nsis --no-sign"
            bundle_nickname: "Windows"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release notes
        id: release_notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" --github-output

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "Codex Tools ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
